name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build universal app
        run: ARCHS='arm64 x86_64' ./build.sh
      - name: Preference and localization tests
        run: ./test.sh
      - name: Verify architecture and signature
        run: |
          for architecture in arm64 x86_64; do
            /usr/bin/lipo 'Soniclet.app/Contents/MacOS/Soniclet' -verify_arch "$architecture"
          done
          codesign --verify --deep --strict 'Soniclet.app'
      - name: Compile graphical smoke test
        run: ./test-settings.sh --build-only
      - name: Build App Store sandbox variant
        run: DISTRIBUTION_CHANNEL=app-store ARCHS='arm64 x86_64' ./build.sh
      - name: Verify sandbox entitlement
        run: |
          codesign --verify --deep --strict '.build/app-store/Soniclet.app'
          codesign --display --entitlements - --xml '.build/app-store/Soniclet.app' > .build/app-store/entitlements.plist
          python3 -c "import plistlib; e=plistlib.load(open('.build/app-store/entitlements.plist','rb')); assert e == {'com.apple.security.app-sandbox': True}, e"
      - name: Compile sandbox graphical smoke test
        run: DISTRIBUTION_CHANNEL=app-store ./test-settings.sh --build-only
