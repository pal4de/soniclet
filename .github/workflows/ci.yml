name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build universal app
        run: ARCHS='arm64 x86_64' ./build.sh
      - name: Preference and localization tests
        run: ./test.sh
      - name: Verify architecture and signature
        run: |
          lipo -verify_arch arm64 x86_64 'Soniclet.app/Contents/MacOS/Soniclet'
          codesign --verify --deep --strict 'Soniclet.app'
      - name: Compile graphical smoke test
        run: ./test-settings.sh --build-only
